<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">초대장</title>
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
/* ── 디자인 리뉴얼 스타일 ── */
:root {
  --primary-bg: #f8f9fa;
  --card-bg: rgba(255, 255, 255, 0.85);
  --accent-color: #007AFF;
  --text-main: #1d1d1f;
  --text-sub: #86868b;
  --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 12px 30px rgba(0, 0, 0, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Pretendard', -apple-system, sans-serif;
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  background-attachment: fixed;
  color: var(--text-main);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px 80px;
}

/* ── 히어로 섹션 ── */
.hero {
  background: rgba(25, 25, 25, 0.95);
  backdrop-filter: blur(10px);
  color: #fff;
  padding: 48px 28px 40px;
  border-radius: 32px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}

.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.1);
  color: #30D158;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 100px;
  margin-bottom: 24px;
}

.hero-tag-dot {
  width: 6px; height: 6px;
  background: #30D158;
  border-radius: 50%;
  box-shadow: 0 0 8px #30D158;
}

.hero h1 {
  font-size: 32px;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 12px;
  letter-spacing: -0.5px;
}

.hero h2 {
  font-size: 17px;
  font-weight: 400;
  color: #a1a1a6;
  margin-bottom: 32px;
}

.hero-chips { display: flex; gap: 8px; }
.chip {
  background: rgba(255, 255, 255, 0.15);
  padding: 8px 16px;
  border-radius: 14px;
  font-size: 14px;
  font-weight: 600;
  backdrop-filter: blur(4px);
}

/* ── 섹션 공통 ── */
.section { margin-top: 32px; }
.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-sub);
  margin-left: 8px;
  margin-bottom: 12px;
  letter-spacing: 0.05em;
}

/* ── 카드 스타일 ── */
.intro-card, .rsvp-card, .stat-card, .reservation-card, .venue-list {
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 24px;
  box-shadow: var(--shadow-sm);
}

.intro-card { padding: 24px; font-size: 16px; line-height: 1.8; color: #3a3a3c; }

/* ── 장소 리스트 ── */
.venue-item {
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom: 1px solid rgba(0,0,0,0.05);
}
.venue-item:last-child { border-bottom: none; }

.venue-icon {
  width: 48px; height: 48px;
  border-radius: 16px;
  background: #fff;
  box-shadow: var(--shadow-sm);
  font-size: 24px;
}

.venue-map-btn {
  background: var(--text-main);
  color: #fff;
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 12px;
  transition: 0.2s;
}

/* ── RSVP 폼 ── */
.rsvp-card { padding: 24px; }
.field input, .field textarea {
  background: rgba(0, 0, 0, 0.03);
  border: 1px solid transparent;
  transition: all 0.2s;
}
.field input:focus, .field textarea:focus {
  background: #fff;
  border-color: var(--accent-color);
  box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
}

.rsvp-opt {
  background: #fff;
  border: 1px solid rgba(0,0,0,0.05);
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.rsvp-opt.selected {
  background: var(--accent-color);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
}
.rsvp-opt.selected .rsvp-opt-label { color: #fff; }

.submit-btn {
  background: var(--accent-color);
  padding: 18px;
  font-size: 17px;
  box-shadow: 0 8px 20px rgba(0, 122, 255, 0.25);
}

/* ── 예약 정보 ── */
.reservation-card {
  background: linear-gradient(135deg, #1d1d1f 0%, #434343 100%);
  padding: 28px;
}
  </style>
</head>
<body>
<div class="page">

  <!-- 히어로 -->
  <div class="hero fade-up">
    <div class="hero-tag">
      <span class="hero-tag-dot"></span>
      참석 응답 받는 중
    </div>
    <h1 id="hero-title"></h1>
    <h2 id="hero-subtitle"></h2>
    <div class="hero-chips">
      <span class="chip"><span class="chip-emoji">📅</span><span id="hero-date"></span></span>
      <span class="chip"><span class="chip-emoji">🕕</span><span id="hero-time"></span></span>
    </div>
  </div>

  <!-- 본문 -->
  <div class="section fade-up d1">
    <div class="section-title">초대의 말</div>
    <div class="intro-card" id="intro-text"></div>
  </div>

  <!-- 장소 -->
  <div class="section fade-up d2">
    <div class="section-title">장소 안내</div>
    <div class="venue-list" id="venue-list"></div>
  </div>

  <!-- RSVP -->
  <div class="section fade-up d3">
    <div class="section-title">참석 여부 알려주기</div>
    <div class="rsvp-card">
      <div class="deadline-badge">⏰ <span id="deadline-text"></span>까지 회신</div>
      <div class="field">
        <label>성함</label>
        <input type="text" id="rsvp-name" placeholder="이름을 입력해주세요" />
      </div>
      <div class="rsvp-options" id="rsvp-options"></div>
      <div class="field">
        <label>한마디 (선택)</label>
        <textarea id="rsvp-msg" placeholder="짧은 메시지를 남겨주세요 :)"></textarea>
      </div>
      <button class="submit-btn" id="submit-btn" onclick="submitRSVP()">참석 여부 보내기</button>
      <p class="form-msg" id="form-msg"></p>
    </div>
  </div>

  <!-- 참석 현황 -->
  <div class="section fade-up d4">
    <div class="section-title">참석자 현황</div>
    <div class="stats-row">
      <div class="stat-card"><span class="stat-num" id="stat-total">–</span><div class="stat-label">전체</div></div>
      <div class="stat-card"><span class="stat-num" id="stat-attend">–</span><div class="stat-label">참석</div></div>
      <div class="stat-card"><span class="stat-num" id="stat-no">–</span><div class="stat-label">불참</div></div>
    </div>
    <div id="response-container">
      <div class="empty-state"><div class="empty-icon">🔄</div>불러오는 중...</div>
    </div>
  </div>

  <!-- 예약 -->
  <div class="section fade-up d5">
    <div class="section-title">예약 안내</div>
    <div class="reservation-card">
      <div class="res-label">예약명</div>
      <div class="res-name" id="res-name"></div>
      <div class="res-desc">먼저 도착하시는 분은 예약 성함을 말씀하시고 편하게 계시면 됩니다. 저희는 퇴근 후 최대한 빨리 넘어갈게요! 그날 뵙겠습니다 😊</div>
    </div>
  </div>

  <footer>made with ♥</footer>
</div>

<script>
var VENUE_ICONS = ['🍖','🍗','🍺','🍣','🍜','🍕','🥗','🍱'];

function parseBold(str) {
  return str.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}
function badgeClass(v) {
  if (v === 'from1') return 'badge-attend';
  if (v === 'from2') return 'badge-late';
  if (v === 'no')    return 'badge-no';
  return '';
}
function badgeLabel(v) {
  var opt = EVENT_CONFIG.rsvp_options.find(function(o){ return o.value === v; });
  return opt ? opt.label : v;
}
function nameToEmoji(name) {
  var emojis = ['😄','😊','🙂','😎','🤗','😇','🥳','😁'];
  var idx = 0;
  for (var i = 0; i < name.length; i++) idx += name.charCodeAt(i);
  return emojis[idx % emojis.length];
}

function render() {
  var c = EVENT_CONFIG;
  document.getElementById('page-title').textContent    = c.title;
  document.getElementById('hero-title').textContent    = c.title;
  document.getElementById('hero-subtitle').textContent = c.subtitle;
  document.getElementById('hero-date').textContent     = c.date;
  document.getElementById('hero-time').textContent     = c.time;
  document.getElementById('deadline-text').textContent = c.deadline;
  document.getElementById('res-name').textContent      = c.reservation_name;
  document.getElementById('intro-text').innerHTML      = parseBold(c.description);

  // 장소
  var venueHTML = '';
  c.venues.forEach(function(v, i) {
    var icon = v.icon || VENUE_ICONS[i % VENUE_ICONS.length];
    venueHTML += '<div class="venue-item">' +
      '<div class="venue-icon">' + icon + '</div>' +
      '<div class="venue-info">' +
        '<div class="venue-round">' + v.round + '</div>' +
        '<div class="venue-name">' + v.name + '</div>' +
        '<div class="venue-desc">' + v.description + '</div>' +
      '</div>' +
      '<a class="venue-map-btn" href="' + v.map_url + '" target="_blank" rel="noopener">📍 지도</a>' +
    '</div>';
    if (v.tip) {
      venueHTML += '<div class="venue-extra venue-extra-tip">💡 <strong>' + v.tip.author + ' 픽</strong> ' + v.tip.text + '</div>';
    }
    if (v.warning) {
      venueHTML += '<div class="venue-extra venue-extra-warn">⚠️ ' + v.warning + '</div>';
    }
  });
  document.getElementById('venue-list').innerHTML = venueHTML;

  // RSVP 옵션
  var optHTML = '';
  c.rsvp_options.forEach(function(o) {
    optHTML += '<label class="rsvp-opt" onclick="selectOpt(this, \'' + o.value + '\')">' +
      '<input type="radio" name="rsvp_status" value="' + o.value + '" />' +
      '<span class="rsvp-opt-label">' + o.label + '</span>' +
    '</label>';
  });
  document.getElementById('rsvp-options').innerHTML = optHTML;
}

function selectOpt(el, value) {
  document.querySelectorAll('.rsvp-opt').forEach(function(o){ o.classList.remove('selected'); });
  el.classList.add('selected');
  el.querySelector('input').checked = true;
}

function submitRSVP() {
  var name   = document.getElementById('rsvp-name').value.trim();
  var status = (document.querySelector('input[name="rsvp_status"]:checked') || {}).value;
  var msg    = document.getElementById('rsvp-msg').value.trim();
  var msgEl  = document.getElementById('form-msg');
  var btn    = document.getElementById('submit-btn');

  if (!name)   { msgEl.style.color='#C0392B'; msgEl.textContent='성함을 입력해주세요.'; return; }
  if (!status) { msgEl.style.color='#C0392B'; msgEl.textContent='참석 여부를 선택해주세요.'; return; }

  btn.disabled = true;
  btn.textContent = '전송 중...';
  msgEl.textContent = '';

  fetch(EVENT_CONFIG.gas_url, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ event_id: EVENT_CONFIG.event_id, name: name, status: status, message: msg })
  }).then(function() {
    msgEl.style.color = '#1A7F37';
    msgEl.textContent = '✅ 전송 완료! 감사합니다 😊';
    btn.textContent = '전송 완료';
    setTimeout(loadResponses, 2000);
  }).catch(function() {
    msgEl.style.color = '#C0392B';
    msgEl.textContent = '❌ 오류가 발생했어요. 다시 시도해주세요.';
    btn.disabled = false;
    btn.textContent = '참석 여부 보내기';
  });
}

// JSONP 방식으로 현황 읽기
function loadResponses() {
  var old = document.getElementById('__jsonp');
  if (old) old.parentNode.removeChild(old);

  window.__gasCallback = function(json) {
    var rows = (json.data || []).filter(function(r){ return r.event_id === EVENT_CONFIG.event_id; });
    var total  = rows.length;
    var attend = rows.filter(function(r){ return r.status !== 'no'; }).length;
    var no     = rows.filter(function(r){ return r.status === 'no'; }).length;

    document.getElementById('stat-total').textContent  = total;
    document.getElementById('stat-attend').textContent = attend;
    document.getElementById('stat-no').textContent     = no;

    var container = document.getElementById('response-container');
    if (rows.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="empty-icon">🙈</div>아직 응답이 없어요</div>';
      return;
    }
    var html = '<div class="response-list">';
    rows.forEach(function(r) {
      html += '<div class="response-item">' +
        '<div class="response-avatar">' + nameToEmoji(r.name || '') + '</div>' +
        '<div class="response-info">' +
          '<div class="response-name">' + (r.name || '-') + '</div>' +
          (r.message ? '<div class="response-msg">' + r.message + '</div>' : '') +
        '</div>' +
        '<span class="status-badge ' + badgeClass(r.status) + '">' + badgeLabel(r.status) + '</span>' +
      '</div>';
    });
    html += '</div>';
    container.innerHTML = html;
  };

  var s = document.createElement('script');
  s.id  = '__jsonp';
  s.src = EVENT_CONFIG.gas_url + '?action=read&callback=__gasCallback&t=' + Date.now();
  s.onerror = function() {
    document.getElementById('response-container').innerHTML =
      '<div class="empty-state"><div class="empty-icon">😢</div>현황을 불러오지 못했어요<br><span style="font-size:12px;color:#C7C7CC">gas_url을 확인해주세요</span></div>';
  };
  document.body.appendChild(s);
}

render();
loadResponses();
</script>
</body>
</html>
