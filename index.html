<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>초대장</title>
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root { --bg: #f2f2f7; --card: #ffffff; --blue: #007AFF; --orange: #FF9500; --gray: #8e8e93; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: #1c1c1e; padding: 20px 16px 80px; line-height: 1.5; }
    .page { max-width: 460px; margin: 0 auto; }
    .hero { background: #1c1c1e; color: #fff; padding: 44px 24px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .hero-tag { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.15); color: #30D158; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 100px; margin-bottom: 16px; }
    .hero h1 { font-size: 26px; font-weight: 800; margin-bottom: 12px; }
    .chip { display: inline-block; background: rgba(255,255,255,0.1); padding: 7px 12px; border-radius: 10px; font-size: 13px; margin-right: 6px; }
    .section-title { font-size: 13px; font-weight: 700; color: var(--gray); margin: 30px 0 10px 8px; }
    .card { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 12px; }
    .venue-item { display: flex; align-items: center; gap: 15px; padding: 15px 0; border-bottom: 1px solid #f2f2f7; }
    .v-icon { width: 45px; height: 45px; background: #f2f2f7; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .v-info { flex: 1; }
    .v-step { font-size: 11px; font-weight: 800; color: var(--blue); }
    .v-name { font-size: 16px; font-weight: 700; }
    .v-map { text-decoration: none; background: #1c1c1e; padding: 8px 12px; border-radius: 10px; font-size: 12px; color: #fff; }
    .opt-btn { padding: 16px; background: #f2f2f7; border-radius: 14px; cursor: pointer; border: 2px solid transparent; font-weight: 600; margin-bottom: 8px; }
    .opt-btn.selected { background: #eef7ff; border-color: var(--blue); color: var(--blue); }
    .submit-btn { width: 100%; padding: 18px; background: var(--blue); color: #fff; border: none; border-radius: 18px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: center; }
    .stat-box { background: #fff; padding: 15px; border-radius: 18px; }
    .stat-num { display: block; font-size: 20px; font-weight: 800; }
    .res-card { background: #1c1c1e; color: #fff; padding: 24px; border-radius: 24px; }
  </style>
</head>
<body>

<div class="page">
  <div class="hero">
    <div class="hero-tag">참석 응답 받는 중</div>
    <h1 id="v-title">불러오는 중...</h1>
    <span class="chip">📅 <span id="v-date"></span></span>
    <span class="chip">🕕 <span id="v-time"></span></span>
  </div>

  <div class="section-title">초대의 말</div>
  <div class="card" id="v-desc" style="white-space: pre-line;"></div>

  <div class="section-title">장소 안내</div>
  <div id="v-venues"></div>

  <div class="section-title">참석 여부</div>
  <div class="card">
    <div style="margin-bottom:15px; font-weight:700; color:var(--orange);">⏰ <span id="v-deadline"></span>까지 회신</div>
    <input type="text" id="i-name" placeholder="성함" style="width:100%; padding:14px; border-radius:12px; border:1px solid #eee; margin-bottom:10px;">
    <div id="v-opts"></div>
    <textarea id="i-msg" placeholder="한마디" style="width:100%; padding:14px; border-radius:12px; border:1px solid #eee; margin-top:10px;"></textarea>
    <button class="submit-btn" id="s-btn" onclick="doSubmit()" style="margin-top:15px;">참석 여부 보내기</button>
    <p id="f-msg" style="text-align:center; margin-top:10px; font-size:13px;"></p>
  </div>

  <div class="section-title">참석 현황</div>
  <div class="stats">
    <div class="stat-box"><span class="stat-num" id="s-total">0</span>전체</div>
    <div class="stat-box"><span class="stat-num" id="s-attend">0</span>참석</div>
    <div class="stat-box"><span class="stat-num" id="s-no">0</span>불참</div>
  </div>

  <div class="section-title">예약 안내</div>
  <div class="res-card">
    <div style="font-size:12px; color:var(--gray)">예약명</div>
    <div id="v-resname" style="font-size:24px; font-weight:800; color:var(--blue)"></div>
  </div>
</div>

<script>
// 2. 데이터가 로드될 때까지 기다리는 안전장치
window.onload = function() {
  const data = window.EVENT_CONFIG;
  if(!data) {
    document.getElementById('v-title').innerText = "데이터 오류 (config.js 확인)";
    return;
  }

  // 화면 그리기
  document.getElementById('v-title').innerText = data.title;
  document.getElementById('v-date').innerText = data.date;
  document.getElementById('v-time').innerText = data.time;
  document.getElementById('v-deadline').innerText = data.deadline;
  document.getElementById('v-resname').innerText = data.reservation_name;
  document.getElementById('v-desc').innerHTML = data.description.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  let vH = "";
  data.venues.forEach(v => {
    vH += `<div class="card"><div class="venue-item">
      <div class="v-icon">${v.icon}</div>
      <div class="v-info"><div class="v-step">${v.round}</div><div class="v-name">${v.name}</div></div>
      <a href="${v.map_url}" class="v-map" target="_blank">지도</a>
    </div></div>`;
  });
  document.getElementById('v-venues').innerHTML = vH;

  let oH = "";
  data.rsvp_options.forEach(o => {
    oH += `<div class="opt-btn" onclick="sel(this, '${o.value}')">${o.label}</div>`;
  });
  document.getElementById('v-opts').innerHTML = oH;
  
  refresh(); // 현황 불러오기
};

let selectedVal = "";
function sel(el, val) {
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedVal = val;
}

function doSubmit() {
  const data = window.EVENT_CONFIG;
  const name = document.getElementById('i-name').value.trim();
  const btn = document.getElementById('s-btn');
  if(!name || !selectedVal) { alert('성함과 옵션을 선택해주세요!'); return; }

  btn.disabled = true; btn.innerText = "전송 중...";
  fetch(data.gas_url, {
    method: 'POST', mode: 'no-cors',
    body: JSON.stringify({ event_id: data.event_id, name: name, status: selectedVal, message: document.getElementById('i-msg').value })
  }).then(() => {
    document.getElementById('f-msg').innerText = "✅ 전송 완료!";
    btn.innerText = "전송 성공";
    setTimeout(refresh, 1000);
  });
}

function refresh() {
  const data = window.EVENT_CONFIG;
  const s = document.createElement('script');
  window.cb = (res) => {
    const list = res.data.filter(r => r.event_id === data.event_id);
    document.getElementById('s-total').innerText = list.length;
    document.getElementById('s-attend').innerText = list.filter(r => r.status !== 'no').length;
    document.getElementById('s-no').innerText = list.filter(r => r.status === 'no').length;
  };
  s.src = `${data.gas_url}?action=read&callback=cb&t=${Date.now()}`;
  document.body.appendChild(s);
}
</script>
</body>
</html>
