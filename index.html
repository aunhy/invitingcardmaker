<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>초대장</title>
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root { --bg: #f2f2f7; --card: #ffffff; --blue: #007AFF; --orange: #FF9500; --gray: #8e8e93; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', sans-serif; background: var(--bg); color: #1c1c1e; padding: 20px 16px 80px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .page { max-width: 460px; margin: 0 auto; }
    
    /* 히어로 */
    .hero { background: #1c1c1e; color: #fff; padding: 44px 24px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .hero-tag { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.15); color: #30D158; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 100px; margin-bottom: 16px; }
    .hero h1 { font-size: 26px; font-weight: 800; margin-bottom: 12px; }
    .chip { display: inline-block; background: rgba(255,255,255,0.1); padding: 7px 12px; border-radius: 10px; font-size: 13px; margin-right: 6px; font-weight: 600; }

    .section-title { font-size: 13px; font-weight: 700; color: var(--gray); margin: 30px 0 10px 8px; text-transform: uppercase; }
    .card { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 12px; overflow: hidden; }

    /* 장소 아이템 */
    .venue-card { padding: 0; }
    .venue-item { display: flex; align-items: center; gap: 15px; padding: 20px; border-bottom: 1px solid #f2f2f7; }
    .venue-item:last-child { border-bottom: none; }
    .v-icon { width: 48px; height: 48px; background: #f2f2f7; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .v-info { flex: 1; min-width: 0; }
    .v-step { font-size: 11px; font-weight: 800; color: var(--blue); margin-bottom: 2px; }
    .v-name { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
    .v-desc { font-size: 13px; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .v-map { text-decoration: none; background: #1c1c1e; padding: 8px 12px; border-radius: 10px; font-size: 12px; color: #fff; font-weight: 600; flex-shrink: 0; }
    
    /* 팁/경고 박스 */
    .v-extra { background: #f9f9fb; padding: 12px 20px; border-top: 1px solid #f2f2f7; font-size: 13px; color: #48484a; }
    .v-extra.warning { border-left: 4px solid #ff3b30; color: #ff3b30; }
    .v-extra.tip { border-left: 4px solid var(--blue); }

    /* RSVP */
    .deadline { font-size: 14px; font-weight: 700; color: var(--orange); margin-bottom: 15px; display: block; }
    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: 13px; font-weight: 700; color: var(--gray); margin-bottom: 8px; }
    .field input, .field textarea { width: 100%; padding: 14px; border: 1.5px solid #efeff4; border-radius: 14px; font-size: 15px; outline: none; background: #f9f9fb; font-family: inherit; }
    .field input:focus { border-color: var(--blue); background: #fff; }

    .opt-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .opt-btn { padding: 16px; background: #f2f2f7; border-radius: 14px; cursor: pointer; border: 2px solid transparent; font-weight: 600; transition: 0.2s; }
    .opt-btn.selected { background: #eef7ff; border-color: var(--blue); color: var(--blue); }

    .submit-btn { width: 100%; padding: 18px; background: var(--blue); color: #fff; border: none; border-radius: 18px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(0,122,255,0.3); }
    .submit-btn:disabled { background: #ccc; box-shadow: none; }

    /* 통계 */
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .stat-box { background: #fff; padding: 18px 10px; border-radius: 20px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
    .stat-num { display: block; font-size: 22px; font-weight: 800; }
    .stat-lbl { font-size: 11px; color: var(--gray); font-weight: 600; }

    .res-card { background: #1c1c1e; color: #fff; padding: 24px; border-radius: 24px; }
    .res-val { font-size: 24px; font-weight: 800; color: var(--blue); margin-top: 5px; }

    footer { padding: 40px; text-align: center; font-size: 11px; color: #c7c7cc; letter-spacing: 1px; }
  </style>
</head>
<body>

<div class="page">
  <div class="hero">
    <div class="hero-tag">참석 응답 받는 중</div>
    <h1 id="view-title">로드 중...</h1>
    <div class="hero-chips">
      <span class="chip">📅 <span id="view-date"></span></span>
      <span class="chip">🕕 <span id="view-time"></span></span>
    </div>
  </div>

  <div class="section-title">초대의 말</div>
  <div class="card" id="view-desc" style="white-space: pre-line;"></div>

  <div class="section-title">장소 안내</div>
  <div id="view-venues" class="venue-container"></div>

  <div class="section-title">참석 여부 알려주기</div>
  <div class="card">
    <span class="deadline">⏰ <span id="view-deadline"></span>까지 회신</span>
    <div class="field">
      <label>성함</label>
      <input type="text" id="input-name" placeholder="이름을 입력해주세요">
    </div>
    <div class="opt-list" id="view-opts"></div>
    <div class="field">
      <label>한마디 (선택)</label>
      <textarea id="input-msg" placeholder="짧은 메시지를 남겨주세요 :)"></textarea>
    </div>
    <button class="submit-btn" id="btn-submit" onclick="doSubmit()">참석 여부 보내기</button>
    <p id="form-msg" style="text-align:center; font-size:13px; margin-top:15px; font-weight:600;"></p>
  </div>

  <div class="section-title">참석 현황</div>
  <div class="stats">
    <div class="stat-box"><span class="stat-num" id="stat-total">0</span><span class="stat-lbl">전체</span></div>
    <div class="stat-box"><span class="stat-num" id="stat-attend">0</span><span class="stat-lbl">참석</span></div>
    <div class="stat-box"><span class="stat-num" id="stat-no">0</span><span class="stat-lbl">불참</span></div>
  </div>

  <div class="section-title">예약 안내</div>
  <div class="res-card">
    <div style="font-size:12px; color:var(--gray)">예약명</div>
    <div class="res-val" id="view-resname"></div>
  </div>

  <footer>MADE BY GEMINI ♥</footer>
</div>

<script>
const data = window.EVENT_CONFIG || {};
let selVal = "";

function draw() {
  if(!data.title) return;
  document.getElementById('view-title').innerText = data.title;
  document.getElementById('view-date').innerText = data.date;
  document.getElementById('view-time').innerText = data.time;
  document.getElementById('view-deadline').innerText = data.deadline;
  document.getElementById('view-resname').innerText = data.reservation_name;
  document.getElementById('view-desc').innerHTML = data.description.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // 장소 렌더링 (카드 안의 개별 리스트 형태)
  let vH = "";
  data.venues.forEach((v, i) => {
    vH += `<div class="card venue-card">
      <div class="venue-item">
        <div class="v-icon">${v.icon || '📍'}</div>
        <div class="v-info">
          <div class="v-step">${v.round}</div>
          <div class="v-name">${v.name}</div>
          <div class="v-desc">${v.description}</div>
        </div>
        <a href="${v.map_url}" class="v-map" target="_blank">지도</a>
      </div>`;
    if(v.tip) vH += `<div class="v-extra tip">💡 <strong>${v.tip.author} 픽:</strong> ${v.tip.text}</div>`;
    if(v.warning) vH += `<div class="v-extra warning">⚠️ ${v.warning}</div>`;
    vH += `</div>`;
  });
  document.getElementById('view-venues').innerHTML = vH;

  // 옵션 렌더링
  let oH = "";
  data.rsvp_options.forEach(o => {
    oH += `<div class="opt-btn" onclick="selectOpt(this, '${o.value}')">${o.label}</div>`;
  });
  document.getElementById('view-opts').innerHTML = oH;
}

function selectOpt(el, val) {
  document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selVal = val;
}

function doSubmit() {
  const name = document.getElementById('input-name').value.trim();
  const btn = document.getElementById('btn-submit');
  const msg = document.getElementById('form-msg');

  if(!name || !selVal) { alert('이름과 참석 여부를 선택해주세요!'); return; }

  btn.disabled = true;
  btn.innerText = "전송 중...";
  msg.style.color = "var(--blue)";
  msg.innerText = "데이터를 전송하고 있습니다.";

  fetch(data.gas_url, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify({
      event_id: data.event_id,
      name: name,
      status: selVal,
      message: document.getElementById('input-msg').value
    })
  }).then(() => {
    msg.style.color = "#34c759";
    msg.innerText = "✅ 전송 완료! 감사합니다.";
    btn.innerText = "완료되었습니다";
    setTimeout(refresh, 1000);
  }).catch(() => {
    btn.disabled = false;
    btn.innerText = "다시 시도하기";
    msg.innerText = "❌ 전송 실패";
  });
}

function refresh() {
  if(!data.gas_url) return;
  const s = document.createElement('script');
  window.cb = (res) => {
    const list = (res.data || []).filter(r => r.event_id === data.event_id);
    document.getElementById('stat-total').innerText = list.length;
    document.getElementById('stat-attend').innerText = list.filter(r => r.status !== 'no').length;
    document.getElementById('stat-no').innerText = list.filter(r => r.status === 'no').length;
  };
  s.src = `${data.gas_url}?action=read&callback=cb&t=${Date.now()}`;
  document.body.appendChild(s);
}

draw();
refresh();
</script>
</body>
</html>
