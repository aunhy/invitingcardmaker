<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">초대장</title>
  <script src="config.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --primary-bg: #f2f2f7;
      --card-bg: #ffffff;
      --accent-color: #007AFF;
      --text-main: #1c1c1e;
      --text-sub: #8e8e93;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background-color: var(--primary-bg);
      color: var(--text-main);
      line-height: 1.5;
      padding: 20px 16px 80px;
    }

    .page { max-width: 460px; margin: 0 auto; min-height: 100vh; }

    /* 히어로 */
    .hero { 
      background: #1c1c1e; color: #fff; padding: 48px 24px; border-radius: 32px; margin-bottom: 24px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
    }
    .hero-tag { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.15); color: #30D158; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 100px; margin-bottom: 20px; }
    .hero-tag-dot { width: 6px; height: 6px; background: #30D158; border-radius: 50%; box-shadow: 0 0 10px #30D158; }
    .hero h1 { font-size: 28px; font-weight: 800; line-height: 1.3; }
    .hero-chips { display: flex; gap: 8px; margin-top: 20px; }
    .chip { background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 10px; font-size: 13px; }

    .section-title { font-size: 14px; font-weight: 700; color: #8e8e93; margin: 32px 0 12px 8px; }

    /* 카드 스타일 */
    .intro-card, .rsvp-card, .venue-card, .stat-card, .reservation-card { 
      background: var(--card-bg); border-radius: 24px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 16px;
    }

    /* 장소 안내 리뉴얼 버전 적용 */
    .venue-body { display: flex; align-items: center; gap: 16px; }
    .venue-icon-box { width: 48px; height: 48px; border-radius: 14px; background: #f2f2f7; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .venue-content { flex: 1; }
    .venue-step { font-size: 11px; font-weight: 800; color: var(--accent-color); margin-bottom: 2px; }
    .venue-name { font-size: 16px; font-weight: 700; }
    .venue-desc { font-size: 13px; color: var(--text-sub); }
    .venue-map-link { width: 36px; height: 36px; background: #f2f2f7; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; flex-shrink: 0; }

    /* RSVP 폼 */
    .deadline-badge { display: inline-flex; background: #fff5eb; color: #ff9500; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; margin-bottom: 20px; }
    .field { margin-bottom: 18px; }
    .field label { display: block; font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
    .field input, .field textarea { width: 100%; padding: 14px; border-radius: 14px; border: 1.5px solid #efeff4; background: #f9f9fb; font-size: 15px; font-family: inherit; outline: none; }
    
    .rsvp-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .rsvp-opt { display: flex; align-items: center; gap: 12px; padding: 15px; border-radius: 14px; background: #f2f2f7; border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
    .rsvp-opt.selected { background: #eef7ff; border-color: var(--accent-color); }
    .rsvp-opt input { display: none; }

    .submit-btn { width: 100%; padding: 18px; border-radius: 16px; background: var(--accent-color); color: #fff; border: none; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3); }
    .submit-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

    .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .stat-card { text-align: center; margin-bottom: 0; }
    .stat-num { display: block; font-size: 22px; font-weight: 800; }
    .stat-label { font-size: 11px; color: #8e8e93; }

    footer { padding: 40px; text-align: center; font-size: 12px; color: #c7c7cc; }
  </style>
</head>
<body>
<div class="page">
  <div class="hero">
    <div class="hero-tag"><span class="hero-tag-dot"></span>참석 응답 받는 중</div>
    <h1 id="hero-title">초대장 불러오는 중...</h1>
    <div class="hero-chips">
      <span class="chip">📅 <span id="hero-date">-</span></span>
      <span class="chip">🕕 <span id="hero-time">-</span></span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">초대의 말</div>
    <div class="intro-card" id="intro-text"></div>
  </div>

  <div class="section">
    <div class="section-title">장소 안내</div>
    <div id="venue-list"></div>
  </div>

  <div class="section">
    <div class="section-title">참석 여부</div>
    <div class="rsvp-card">
      <div class="deadline-badge">⏰ <span id="deadline-text">-</span>까지 회신</div>
      <div class="field">
        <label>성함</label>
        <input type="text" id="rsvp-name" placeholder="이름 입력" />
      </div>
      <div class="rsvp-options" id="rsvp-options"></div>
      <div class="field">
        <label>메시지</label>
        <textarea id="rsvp-msg" placeholder="여기에 작성해주세요 :)"></textarea>
      </div>
      <button class="submit-btn" id="submit-btn" onclick="submitRSVP()">참석 여부 보내기</button>
      <p id="form-msg" style="text-align:center; font-size:13px; margin-top:12px; min-height: 1.2em;"></p>
    </div>
  </div>

  <div class="section">
    <div class="section-title">참석 현황</div>
    <div class="stats-row">
      <div class="stat-card"><span class="stat-num" id="stat-total">0</span><div class="stat-label">전체</div></div>
      <div class="stat-card"><span class="stat-num" id="stat-attend">0</span><div class="stat-label">참석</div></div>
      <div class="stat-card"><span class="stat-num" id="stat-no">0</span><div class="stat-label">불참</div></div>
    </div>
    <div id="response-container" style="margin-top:12px;"></div>
  </div>

  <footer>made with ♥</footer>
</div>

<script>
// 데이터 유실 방지를 위한 초기화 로직
const config = window.EVENT_CONFIG || { title: "초대장", venues: [], rsvp_options: [] };
const VENUE_ICONS = ['🍖','🍗','🍺','🍣','🍜','🍕','🥗','🍱'];

function render() {
  try {
    document.getElementById('hero-title').textContent = config.title;
    document.getElementById('hero-date').textContent = config.date || '-';
    document.getElementById('hero-time').textContent = config.time || '-';
    document.getElementById('deadline-text').textContent = config.deadline || '-';
    document.getElementById('intro-text').innerHTML = (config.description || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    let vHTML = '';
    config.venues.forEach((v, i) => {
      vHTML += `
        <div class="venue-card">
          <div class="venue-body">
            <div class="venue-icon-box">${v.icon || VENUE_ICONS[i%8]}</div>
            <div class="venue-content">
              <div class="venue-step">${v.round}</div>
              <div class="venue-name">${v.name}</div>
              <div class="venue-desc">${v.description}</div>
            </div>
            <a class="venue-map-link" href="${v.map_url}" target="_blank">📍</a>
          </div>
        </div>`;
    });
    document.getElementById('venue-list').innerHTML = vHTML;

    let oHTML = '';
    config.rsvp_options.forEach(o => {
      oHTML += `<label class="rsvp-opt" onclick="selectOpt(this, '${o.value}')">
        <input type="radio" name="rsvp_status" value="${o.value}" />
        <span class="rsvp-opt-label">${o.label}</span>
      </label>`;
    });
    document.getElementById('rsvp-options').innerHTML = oHTML;
  } catch (e) {
    console.error("Rendering Error:", e);
  }
}

function selectOpt(el, val) {
  document.querySelectorAll('.rsvp-opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  const input = el.querySelector('input');
  if(input) input.checked = true;
}

function submitRSVP() {
  const name = document.getElementById('rsvp-name').value.trim();
  const statusInput = document.querySelector('input[name="rsvp_status"]:checked');
  const msg = document.getElementById('rsvp-msg').value.trim();
  const msgEl = document.getElementById('form-msg');
  const btn = document.getElementById('submit-btn');

  if(!name || !statusInput) {
    msgEl.style.color = '#ff3b30';
    msgEl.textContent = '성함과 참석 여부를 입력해주세요!';
    return;
  }

  btn.disabled = true;
  btn.textContent = '보내는 중...';
  msgEl.style.color = '#007aff';
  msgEl.textContent = '데이터를 안전하게 전송하고 있습니다.';

  fetch(config.gas_url, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify({ event_id: config.event_id, name: name, status: statusInput.value, message: msg })
  }).then(() => {
    msgEl.style.color = '#34c759';
    msgEl.textContent = '✅ 전송 완료! 현황을 업데이트합니다.';
    btn.textContent = '참석 응답 완료';
    setTimeout(loadResponses, 1000);
  }).catch(err => {
    console.error(err);
    btn.disabled = false;
    btn.textContent = '다시 보내기';
    msgEl.textContent = '전송 실패 😢 잠시 후 다시 시도해주세요.';
  });
}

function loadResponses() {
  if(!config.gas_url) return;
  const old = document.getElementById('__jsonp'); if(old) old.remove();
  
  window.__gasCallback = function(json) {
    if(!json || !json.data) return;
    const rows = json.data.filter(r => r.event_id === config.event_id);
    document.getElementById('stat-total').textContent = rows.length;
    document.getElementById('stat-attend').textContent = rows.filter(r=>r.status!=='no').length;
    document.getElementById('stat-no').textContent = rows.filter(r=>r.status==='no').length;
    // 리스트 렌더링 생략 (먹통 방지 위해 상태값만 업데이트)
  };

  const s = document.createElement('script');
  s.id = '__jsonp';
  s.src = config.gas_url + '?action=read&callback=__gasCallback&t=' + Date.now();
  document.body.appendChild(s);
}

render();
loadResponses();
</script>
</body>
</html>
